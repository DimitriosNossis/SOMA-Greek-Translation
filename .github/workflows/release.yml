name: Release Zip

# Builds SOMA_Greek_<tag>.zip from the contents of the mod folder
# (config, fonts, script) and attaches it to the release.
#
# Runs automatically when a release is published. It can also be run by hand
# from the Actions tab for an existing release (e.g. to rebuild v0.9.0).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the zip for (e.g. v0.9.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package mod files
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the release tag
        uses: "actions/checkout@v4"
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Zip the mod folder
        run: |
          cd mod
          zip -r -X "../SOMA_Greek_${TAG}.zip" config fonts script
          cd ..
          unzip -l "SOMA_Greek_${TAG}.zip"

      - name: Attach the zip to the release
        run: gh release upload "$TAG" "SOMA_Greek_${TAG}.zip" --clobber
